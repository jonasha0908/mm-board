<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: team-branded control room. Sticky header + week rail (Blue Alliance style), week board below, slide deck for the weekly summary. Single dark look, matching the team's deck. */
:root{
  --bg:#0a1924; --panel:#0f2433; --panel-2:#143149; --line:#2a5a70; --cyan:#4fb8d0; --glow:#a8f1f6;
  --orange:#ff6b0a; --orange-soft:#ff6b0a26; --text:#e8f2f6; --muted:#8eadbc; --ok:#57d39a; --danger:#ff7a7a;
  --f-display:"Rubik","Secular One","Arial Hebrew",system-ui,sans-serif;
  --f-body:"Open Sans","Segoe UI","Arial Hebrew",system-ui,sans-serif;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 82%,#0a192400);padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:44px;width:auto}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--glow);text-shadow:0 0 14px #6fe3ee88}
.brand .sub{color:var(--muted);font-size:.82rem}
.brand .grow{flex:1;min-width:0}
.stage-pill{border:1.5px solid var(--orange);color:var(--orange);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700;white-space:nowrap}

/* week rail */
.rail{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 8px;scrollbar-width:thin;margin-top:8px}
.wk{flex:0 0 auto;min-width:74px;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 10px 6px;text-align:center;line-height:1.2}
.wk b{display:block;font-family:var(--f-display);font-weight:700;font-size:.95rem;direction:ltr}
.wk small{color:var(--muted);font-size:.72rem;direction:ltr;display:block}
.wk.cur{border-color:var(--orange)}
.wk.cur b{color:var(--orange)}
.wk[aria-current="true"]{background:var(--panel-2);border-color:var(--glow);box-shadow:0 0 14px #4fb8d055}
.wk.future{opacity:.65}

/* week head */
.weekhead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-top:18px}
.weekhead h2{font-family:var(--f-display);font-weight:800;font-size:2rem;margin:0;color:var(--glow);text-shadow:0 0 16px #6fe3ee77;line-height:1.1}
.weekhead .dates{color:var(--muted);font-size:.95rem;margin-top:4px}
.events{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ev{background:var(--orange-soft);color:#ffb37f;border-radius:6px;padding:2px 9px;font-size:.8rem}
.progress{min-width:220px}
.progress .nums{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.progress .nums b{color:var(--text);font-family:var(--f-display);font-size:1.4rem}
.bar{height:8px;background:#ffffff14;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--glow));border-radius:99px}

/* tabs & controls */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:20px;border-bottom:1px solid #ffffff14;padding-bottom:10px}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--text);box-shadow:inset 0 -2px 0 var(--orange)}
.btn{border:1.5px solid var(--cyan);background:transparent;color:var(--glow);border-radius:10px;padding:7px 14px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:#4fb8d01a}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#1a0b00}
.btn.primary:hover{background:#ff8636}
.btn.ghost{border-color:#ffffff22;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid #ffffff22;background:transparent;border-radius:999px;padding:3px 12px;font-size:.83rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--glow);background:#4fb8d014}

.notice{border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;color:var(--muted);margin-top:16px}
.notice b{color:var(--text)}

/* tasks */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:16px}
.team{background:var(--panel);border:1.5px solid #4fb8d040;border-radius:var(--r);padding:12px 14px 10px;min-width:0}
.team header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.team h3{font-family:var(--f-display);font-weight:700;font-size:1.08rem;margin:0;color:var(--orange)}
.team header span{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:6px 0;border-top:1px solid #ffffff0d}
.task:first-of-type{border-top:0}
.check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--cyan);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--cyan)}
.task.done .check svg{opacity:1}
.task .t{min-width:0;overflow-wrap:anywhere}
.task.done .t .title{color:var(--muted);text-decoration:line-through;text-decoration-color:#8eadbc88}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:.7rem;border-radius:5px;padding:0 6px;background:#ffffff10;color:var(--muted)}
.tag.added{background:var(--orange-soft);color:#ffb37f}
.tag.carried{background:#4fb8d01f;color:var(--glow)}
.del{background:none;border:0;color:#ffffff40;font-size:1rem;padding:0 4px;line-height:1.4}
.del:hover{color:var(--danger)}
.del.arm{color:var(--danger);font-size:.75rem;font-weight:700}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1;min-width:0;background:#0000002a;border:1px solid #ffffff1c;border-radius:8px;padding:5px 10px;font-size:.88rem}
.addrow button{border:1px solid #ffffff22;background:none;border-radius:8px;padding:0 10px;color:var(--muted)}
.empty-team{color:var(--muted);font-size:.85rem;padding:4px 0}

/* panel: daily summary */
.panel{background:var(--panel);border:1.5px solid var(--cyan);border-radius:var(--r);padding:16px;margin-top:16px;box-shadow:0 0 24px #4fb8d022}
.panel h3{font-family:var(--f-display);margin:0 0 10px;font-size:1.15rem;color:var(--glow)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.f input,.f select,.f textarea,textarea.big{background:#00000033;border:1px solid #ffffff22;border-radius:8px;padding:8px 10px;color:var(--text);font-size:.95rem}
textarea.big{width:100%;min-height:150px;resize:vertical;margin-top:10px;line-height:1.55}
.seg{display:inline-flex;border:1px solid #ffffff22;border-radius:9px;overflow:hidden;margin-top:12px}
.seg button{background:none;border:0;padding:6px 14px;color:var(--muted);font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.hint{color:var(--muted);font-size:.8rem}
.prop{margin-top:14px;border-top:1px solid #ffffff14;padding-top:12px}
.prow{display:grid;grid-template-columns:22px 128px 150px 1fr;gap:8px;align-items:center;padding:4px 0}
.prow input[type=text],.prow select{background:#00000033;border:1px solid #ffffff1c;border-radius:7px;padding:4px 8px;font-size:.88rem;min-width:0}
.kind{font-size:.75rem;font-weight:700;border-radius:6px;padding:2px 6px;text-align:center}
.kind.complete{background:#57d39a22;color:var(--ok)}
.kind.new_done{background:#4fb8d022;color:var(--glow)}
.kind.new_todo{background:var(--orange-soft);color:#ffb37f}
.err{color:var(--danger);font-size:.88rem}

/* logs */
.logs{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.log{background:var(--panel);border-radius:var(--r);padding:12px 14px;border-inline-start:3px solid var(--cyan)}
.log.open{border-inline-start-color:var(--orange)}
.log .meta{font-size:.8rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.log pre{white-space:pre-wrap;font-family:var(--f-body);margin:6px 0 0;font-size:.92rem;overflow-wrap:anywhere}

/* slides */
.deck-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.deck{display:flex;flex-direction:column;gap:18px;margin-top:16px}
.slide{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#0b1b27;border-radius:6px;overflow:hidden;container-type:inline-size;box-shadow:0 10px 30px #0008;font-size:1.6cqw}
.slide::before{content:"";position:absolute;top:0;right:0;width:16cqw;height:24cqw;background:linear-gradient(200deg,var(--orange),#d9480f);clip-path:polygon(100% 0,0 0,0 6%,60% 6%,72% 22%,72% 60%,90% 78%,100% 78%)}
.slide::after{content:"";position:absolute;bottom:0;left:0;width:22cqw;height:20cqw;background:linear-gradient(20deg,var(--orange),#d9480f);clip-path:polygon(0 18%,0 100%,100% 100%,100% 94%,38% 94%,26% 80%,26% 36%,12% 18%)}
.s-logo{position:absolute;top:1.6cqw;left:1.8cqw;width:9cqw;z-index:2}
.s-foot{position:absolute;bottom:1.4cqw;right:2.2cqw;direction:ltr;display:flex;gap:1.6cqw;align-items:center;z-index:2}
.s-foot img{height:4cqw;width:auto}
.s-body{position:absolute;inset:6cqw 5cqw 6cqw 5cqw;display:flex;flex-direction:column;z-index:1}
.s-title{font-family:var(--f-display);font-weight:800;color:var(--glow);text-shadow:0 0 1.4cqw #6fe3ee99;font-size:3.6cqw;line-height:1.1;text-align:center;margin:0}
.s-sub{text-align:center;font-weight:700;color:#fff;font-size:2cqw;margin-top:.6cqw}
.hexframe{margin:auto;width:78%;padding:.45cqw;background:#3fa0bd;clip-path:polygon(8% 0,92% 0,100% 22%,100% 78%,92% 100%,8% 100%,0 78%,0 22%)}
.hexframe>div{background:#10283a;clip-path:polygon(8% 0,92% 0,100% 22%,100% 78%,92% 100%,8% 100%,0 78%,0 22%);padding:4cqw 3cqw;text-align:center}
.hexframe .s-title{font-size:4.6cqw}
.big-logo{width:20cqw;margin:0 auto 1.4cqw;display:block}
.s-cols{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw;margin-top:2cqw;flex:1;min-height:0}
.box{border:.28cqw solid #5cc3d6;border-radius:1.4cqw;padding:1.4cqw 1.8cqw;box-shadow:0 0 2.2cqw #4fb8d044, inset 0 0 1.4cqw #4fb8d01a;min-height:0;overflow:hidden}
.box h4{font-family:var(--f-display);color:var(--orange);font-size:2.3cqw;margin:0 0 .8cqw}
.box ul{margin:0;padding-inline-start:2.2cqw;font-size:1.55cqw;line-height:1.45}
.box li{margin:.15cqw 0}
.box li small{color:#ffb37f;font-size:1.1cqw}
.s-lead{font-size:1.7cqw;color:#dfeaf0;text-align:center;margin:1cqw auto 0;max-width:80%}
.s-table{width:100%;border-collapse:collapse;margin-top:2cqw;font-size:1.55cqw}
.s-table th{background:var(--orange);color:#fff;font-weight:700;padding:.9cqw;font-size:1.5cqw}
.s-table td{background:#fff;color:#111;padding:.75cqw 1cqw;border:1px solid #ccd;text-align:center;font-weight:600}
.s-table td:first-child{text-align:right}
.mini{height:1cqw;background:#e5e9ee;border-radius:1cqw;overflow:hidden}
.mini i{display:block;height:100%;background:var(--orange)}
.aitag{font-size:.75rem;color:var(--muted)}

.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--cyan);padding:8px 16px;border-radius:10px;z-index:20;font-size:.9rem}
.codebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.codebar .addrow{margin:0;min-width:240px}
.copyfallback{width:100%;min-height:160px;margin-top:10px;background:#00000033;border:1px solid #ffffff22;border-radius:8px;padding:8px;color:var(--text)}

@media (max-width:640px){
  .top{position:static}
  .weekhead{grid-template-columns:1fr}
  .weekhead h2{font-size:1.6rem}
  .teams{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .prow{grid-template-columns:22px 1fr;}
  .prow .kind{justify-self:start}
  .prow select,.prow input[type=text]{grid-column:1 / -1}
  .brand h1{font-size:1.1rem}
  .check{width:30px;height:30px}
  .task{grid-template-columns:34px 1fr auto}
  .addrow input,.f input,.f select,.f textarea,textarea.big,.prow input[type=text],.prow select,#teamCode{font-size:16px}
  .del{font-size:1.25rem;padding:0 8px}
  .stage-pill{display:none}
}
@media (max-width:640px){
  .slide{aspect-ratio:auto;font-size:14px}
  .s-body{position:relative;inset:auto;padding:64px 16px 56px}
  .s-logo{width:58px;top:10px;left:12px}
  .s-foot{bottom:10px;right:14px;gap:10px}
  .s-foot img{height:22px}
  .s-title{font-size:22px}
  .hexframe{width:100%}
  .hexframe>div{padding:26px 18px}
  .hexframe .s-title{font-size:26px}
  .big-logo{width:110px;margin-bottom:10px}
  .s-sub{font-size:14px;margin-top:6px}
  .s-lead{font-size:14px;max-width:none;margin-top:8px}
  .s-cols{grid-template-columns:1fr;gap:12px;margin-top:14px}
  .box{border-width:2px;border-radius:12px;padding:12px 14px;overflow:visible}
  .box h4{font-size:16px;margin-bottom:6px}
  .box ul{font-size:14px;padding-inline-start:18px}
  .box li small{font-size:11px}
  .box[style]{width:100%!important;margin-top:14px!important}
  .box ul[style]{font-size:15px!important}
  .s-table{font-size:12px;margin-top:14px}
  .s-table th{font-size:11.5px;padding:6px 4px}
  .s-table td{padding:6px}
  .mini{height:8px}
  .deck{gap:14px}
}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid #ffffff22;background:#0004;padding:0;cursor:zoom-in;flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;left:2px;background:#000b;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:20px;padding:0;cursor:pointer}
.thumb.pending{opacity:.6}
.log .thumbs .thumb{width:96px;height:96px}
.tact{display:flex;align-items:flex-start;gap:2px}
.camera{background:none;border:0;color:#ffffff55;padding:0 4px;font-size:1rem;line-height:1.4}
.camera:hover{color:var(--glow)}
.attach{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.lightbox{position:fixed;inset:0;background:#000e;z-index:30;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.s-gallery{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:1.4cqw;flex:1;min-height:0;margin-top:1.6cqw}
.s-gallery figure{margin:0;position:relative;border:.25cqw solid #5cc3d6;border-radius:1cqw;overflow:hidden;min-height:0;background:#0006;cursor:zoom-in}
.s-gallery img{width:100%;height:100%;object-fit:cover;display:block}
.s-gallery figcaption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000c);color:#fff;font-size:1.25cqw;padding:1.4cqw .9cqw .6cqw}
@media (max-width:640px){
  .s-gallery{grid-template-columns:repeat(2,1fr);grid-auto-rows:130px;gap:8px;margin-top:12px}
  .s-gallery figure{border-width:2px;border-radius:10px}
  .s-gallery figcaption{font-size:11px;padding:14px 6px 4px}
}
.kind-sel{font-size:.75rem;font-weight:700;border-radius:6px;padding:3px 4px;border:0;min-width:0;cursor:pointer}
.kind-sel.new_done{background:#4fb8d022;color:var(--glow)}
.kind-sel.new_todo{background:var(--orange-soft);color:#ffb37f}
.kind-sel option{background:var(--panel);color:var(--text)}
.note{color:var(--muted);font-size:.83rem;white-space:pre-wrap;margin-top:2px;overflow-wrap:anywhere}
.editbox{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.editbox input,.editbox textarea,.editbox select{background:#00000033;border:1px solid #ffffff22;border-radius:8px;padding:6px 9px;color:var(--text);font-size:.92rem;width:100%;min-width:0}
.editbox textarea{min-height:70px;resize:vertical;line-height:1.5}
.editbox label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.editrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.editbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn.sm{padding:4px 12px;font-size:.84rem;border-radius:8px}
.btn.danger{border-color:#ff7a7a66;color:var(--danger)}
.icon{background:none;border:0;color:#ffffff55;padding:0 4px;font-size:.95rem;line-height:1.4}
.icon:hover{color:var(--glow)}
.icon.arm{color:var(--danger);font-size:.75rem;font-weight:700}
.log .meta{align-items:center}
.log .meta .grow{flex:1}
.sumedit .team-ed{border-top:1px solid #ffffff14;padding-top:10px;margin-top:4px}
.sumedit h4{margin:0 0 6px;color:var(--orange);font-family:var(--f-display);font-size:1rem}
.install{border:1.5px solid var(--glow);color:var(--glow);background:none;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700;white-space:nowrap}
.ioshint{display:flex;gap:10px;align-items:center;justify-content:space-between}
.ioshint button{background:none;border:0;color:var(--muted);font-size:1.1rem}
@media (display-mode:standalone){.install{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function heuristicParse(P,existing){
  const fallbackTeam=P.team!=="auto"?P.team:(detectTeam(composedText(P))||TEAMS[0].id);
  let done=[],todo=[];
  if(P.mode==="form"){done=lines(P.done);todo=lines(P.todo)}
  else{
    let mode=null;
    for(const raw of P.text.split(/\n/)){
      const l=raw.trim(); if(!l) continue;
      const n=norm(l);
      const rest=()=>l.split(/[:：]/).slice(1).join(":").trim();
      if(/^(נעשה|בוצע|מה עשינו|הושלם)/.test(n)){mode="done";if(rest())done.push(rest());continue}
      if(/^(צריך לעשות|לעשות|משימות|מה נשאר|נשאר|לא נעשה|המשך)/.test(n)){mode="todo";if(rest())todo.push(rest());continue}
      if(/^צוות/.test(n)) continue;
      const item=lines(l)[0]; if(!item) continue;
      (mode==="done"?done:todo).push(item);
    }
  }
  const out=[], open=existing.filter(t=>!t.done);
  for(const d of done){
    const m=open.find(t=>norm(t.title)===norm(d)||norm(t.title).includes(norm(d))||norm(d).includes(norm(t.title)));
    if(m) out.push({kind:"complete",taskId:m.id,team:m.team,text:m.title,include:true});
    else out.push({kind:"new_done",team:fallbackTeam,text:d,include:true});
  }
  for(const d of todo){ if(!existing.some(t=>norm(t.title)===norm(d))) out.push({kind:"new_todo",team:fallbackTeam,text:d,include:true}) }
  return out;
}

      const res=await run(()=>ai(parsePrompt(P,w,text,existing)));
      const items=Array.isArray(res&&res.items)?res.items:[];
      const open=new Map(existing.filter(t=>!t.done).map(t=>[t.id,t]));

  deck.append(slideShell(el("h3",{class:"s-title",text:ai&&ai.headline?ai.headline:"תמונת מצב שבועית"}),ai&&ai.overview?el("p",{class:"s-lead",text:ai.overview}):null,tbl));

  for(const t of active){
    const x=teamStats(t.id);
    const tai=ai&&Array.isArray(ai.teams)?ai.teams.find(z=>z.teamId===t.id):null;
    const addedIds=new Set(x.added.map(a=>a.id));
    const li=task=>el("li",null,task.title,addedIds.has(task.id)?el("small",{text:"  · נוסף במהלך השבוע"}):null);
    const right=el("div",{class:"box"},el("h4",{text:"בוצע ✓"}),el("ul",null,x.done.length?x.done.map(li):el("li",{text:"—"})));
    const leftKids=[el("h4",{text:"נשאר פתוח"}),el("ul",null,x.open.length?x.open.map(li):el("li",{text:"הכל בוצע"}))];
    if(tai&&Array.isArray(tai.nextWeek)&&tai.nextWeek.length) leftKids.push(el("h4",{text:"פוקוס לשבוע הבא",style:"margin-top:1.2cqw"}),el("ul",null,tai.nextWeek.slice(0,4).map(v=>el("li",{text:String(v)}))));
    deck.append(slideShell(el("h3",{class:"s-title",text:"צוות "+t.name}),tai&&tai.summary?el("p",{class:"s-lead",text:String(tai.summary)}):null,
      el("div",{class:"s-cols"},right,el("div",{class:"box"},leftKids))));
  }
  const gal=[];
  for(const l of [...S.logs].sort((a,b)=>a.date.localeCompare(b.date))) for(const id of l.images) gal.push({id,cap:(l.team&&TEAM[l.team]?TEAM[l.team].name+" · ":"")+dm(parseIso(l.date))});
  for(const t of S.tasks) for(const id of t.images) gal.push({id,cap:(TEAM[t.team]?TEAM[t.team].name+" · ":"")+t.title});
  for(let i=0;i<gal.length;i+=6){
    const chunk=gal.slice(i,i+6);
    deck.append(slideShell(el("h3",{class:"s-title",text:"תמונות מהשבוע"+(gal.length>6?" ("+(i/6+1)+")":"")}),
      el("div",{class:"s-gallery"},chunk.map(g=>el("figure",{onclick:()=>openLightbox(imgUrl(g.id,1600))},el("img",{src:imgUrl(g.id,800),alt:"",loading:"lazy",referrerpolicy:"no-referrer"}),el("figcaption",{text:g.cap.slice(0,70)}))))));
  }
  if(ai&&Array.isArray(ai.focusNextWeek)&&ai.focusNextWeek.length){
    deck.append(slideShell(el("h3",{class:"s-title",text:"פוקוס לשבוע "+(S.week+1)}),
      el("div",{class:"box",style:"margin:2cqw auto 0;width:70%"},el("ul",{style:"font-size:2cqw"},ai.focusNextWeek.slice(0,7).map(v=>el("li",{text:String(v)}))))));
  }
}
async function generateSummary(){
  if(!S.ai||!guard()) return;
  const btn=$("genSummary"); btn.disabled=true; btn.textContent="כותב סיכום… (עד דקה)";
  const s=weekStart(S.week), e=weekEnd(S.week), st=stageFor(e);
  const sat=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);
  const evs=EVENTS.filter(ev=>{const dd=parseIso(ev.date);return dd>=s&&dd<=sat}).map(ev=>ev.date+" "+ev.title);
  const teamsTxt=TEAMS.map(t=>{
    const x=teamStats(t.id); if(!x.list.length) return null;
    const addedIds=new Set(x.added.map(a=>a.id));
    return "## "+t.id+" ("+t.name+")\nבוצע:\n"+(x.done.map(z=>"- "+z.title+(addedIds.has(z.id)?" [נוסף במהלך השבוע]":"")).join("\n")||"- אין")+"\nפתוח:\n"+(x.open.map(z=>"- "+z.title).join("\n")||"- אין");
  }).filter(Boolean).join("\n\n");
  const logsTxt=[...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).map(l=>"["+l.date+" "+(l.kind==="open"?"פתיחה":"סגירה")+(l.team?" "+l.team:"")+"]\n"+l.text.slice(0,1500)).join("\n\n").slice(0,30000);
  const prompt=`אתה כותב את סיכום השבוע של קבוצת הרובוטיקה FTC "MM" (מרכז חוסידמן, אוניברסיטת בן-גוריון). הסיכום יוצג בשקפים בעברית.
שבוע ${S.week} בעונה, ${iso(s)} עד ${iso(e)}. שלב בעונה: ${st.name} (יעד ביצוע מתוך ה-KPI: ${st.kpi}).
${evs.length?"אירועים השבוע: "+evs.join("; "):""}

משימות לפי צוות:
${teamsTxt||"(אין משימות)"}

סיכומים יומיים שנכתבו השבוע:
${logsTxt||"(אין)"}

החזר רק JSON בצורה:
{"headline":"כותרת קצרה לשבוע (עד 7 מילים)","overview":"2-3 משפטים על השבוע כולו","teams":[{"teamId":"<id>","summary":"משפט אחד או שניים על הצוות","nextWeek":["עד 3 פריטים קצרים"]}],"focusNextWeek":["3-5 פריטים קצרים לכל הקבוצה"]}
כללים: כתוב בעברית תקנית וקצרה, בסגנון מצגת. התבסס רק על המידע למעלה, אל תמציא הישגים. כלול ב-teams רק צוותים שמופיעים ברשימה.`;
  try{
    const r=await run(()=>ai(prompt));
    if(!r||typeof r!=="object") throw {code:"ai_bad_json"};
    const clean={headline:String(r.headline||"").slice(0,120),overview:String(r.overview||"").slice(0,800),
      teams:(Array.isArray(r.teams)?r.teams:[]).filter(t=>t&&TEAM[t.teamId]).map(t=>({teamId:t.teamId,summary:String(t.summary||"").slice(0,400),nextWeek:(Array.isArray(t.nextWeek)?t.nextWeek:[]).slice(0,4).map(x=>String(x).slice(0,140))})),
      focusNextWeek:(Array.isArray(r.focusNextWeek)?r.focusNextWeek:[]).slice(0,7).map(x=>String(x).slice(0,160))};
    const now=Date.now();
    await run(()=>batch([{op:"upsert",sheet:"summaries",row:{id:"w"+S.week,week:S.week,json:JSON.stringify(clean),generatedAt:now,editedAt:""}}]));
    S.summary={ai:clean,generatedAt:now,editedAt:0};
    toast("סיכום השבוע נוצר");
  }catch(err){
    if(err&&err.code==="bad_code") writeErr(err);
    else if(err&&err.code==="ai_rate_limited") toast("Gemini עמוס כרגע, נסו שוב בעוד דקה");
    else toast("יצירת הסיכום נכשלה, נסו שוב");
  }finally{btn.disabled=false;renderDeck()}
}
function startSumEdit(){
  if(!guard()) return;
  const ai=S.summary&&S.summary.ai||{}, aiTeams=Array.isArray(ai.teams)?ai.teams:[];
  const active=TEAMS.filter(t=>teamStats(t.id).list.length||aiTeams.some(z=>z.teamId===t.id));
  S.editSum={headline:ai.headline||"",overview:ai.overview||"",focus:(ai.focusNextWeek||[]).join("\n"),saving:false,
    teams:active.map(t=>{const z=aiTeams.find(x=>x.teamId===t.id)||{};return{teamId:t.id,summary:z.summary||"",next:(z.nextWeek||[]).join("\n")}})};
  renderDeck(); const f=$("se-headline"); if(f) f.focus();
}
function renderSumEdit(){
  const box=$("sumEdit"); box.textContent="";
  const D=S.editSum; if(!D) return;
  const inp=(id,val,set,ph)=>{const i=el("input",{type:"text",id,placeholder:ph||""});i.value=val;i.oninput=()=>set(i.value);return i};
  const area=(id,val,set,ph,h)=>{const a=el("textarea",{id,placeholder:ph||"",style:h?"min-height:"+h+"px":null});a.value=val;a.oninput=()=>set(a.value);return a};
  const teamsEls=D.teams.map((z,i)=>el("div",{class:"team-ed"},el("h4",{text:"צוות "+(TEAM[z.teamId]?TEAM[z.teamId].name:z.teamId)}),
    el("label",null,"משפט סיכום",area("se-t"+i,z.summary,v=>z.summary=v,"מה הצוות עשה השבוע",60)),
    el("label",null,"פוקוס לשבוע הבא (שורה לכל פריט)",area("se-n"+i,z.next,v=>z.next=v,"",60))));
  box.append(el("div",{class:"panel sumedit"},el("h3",{text:"עריכת סיכום שבוע "+S.week}),el("div",{class:"editbox"},
    el("label",null,"כותרת השבוע",inp("se-headline",D.headline,v=>D.headline=v,"למשל: השלדה עומדת, האיסוף בדרך")),
    el("label",null,"סיכום כללי",area("se-overview",D.overview,v=>D.overview=v,"2-3 משפטים על השבוע",80)),
    teamsEls,
    el("label",{style:"margin-top:6px"},"פוקוס לשבוע הבא לכל הקבוצה (שורה לכל פריט)",area("se-focus",D.focus,v=>D.focus=v,"",80)),
    el("div",{class:"hint",text:"רשימות \"בוצע\" ו\"נשאר פתוח\" בשקפים מגיעות מהמשימות עצמן. כדי לשנות אותן, ערכו את המשימות בלשונית משימות."}),
    el("div",{class:"editbtns"},
      el("button",{class:"btn primary sm",disabled:D.saving,onclick:saveSumEdit},D.saving?"שומר…":"שמור סיכום"),
      el("button",{class:"btn ghost sm",onclick:()=>{S.editSum=null;renderDeck()}},"ביטול"),
      el("button",{class:"btn ghost sm",onclick:()=>{S.editSum=null;setTab("tasks")}},"לעריכת המשימות")))));
}
async function saveSumEdit(){
  const D=S.editSum; if(!D||!guard()) return;
  D.saving=true; renderSumEdit();
  const clean={headline:D.headline.trim().slice(0,120),overview:D.overview.trim().slice(0,800),
    teams:D.teams.map(z=>({teamId:z.teamId,summary:z.summary.trim().slice(0,400),nextWeek:lines(z.next).slice(0,4).map(x=>x.slice(0,140))})).filter(z=>z.summary||z.nextWeek.length),
    focusNextWeek:lines(D.focus).slice(0,7).map(x=>x.slice(0,160))};
  const now=Date.now(), gen=S.summary&&S.summary.generatedAt||now;
  try{
    await run(()=>batch([{op:"upsert",sheet:"summaries",row:{id:"w"+S.week,week:S.week,json:JSON.stringify(clean),generatedAt:gen,editedAt:now}}]));
    S.summary={ai:clean,generatedAt:gen,editedAt:now}; S.editSum=null; toast("סיכום השבוע נשמר"); renderDeck();
  }catch(e){D.saving=false;renderSumEdit();writeErr(e)}
}
function summaryText(){
  const s=weekStart(S.week), e=weekEnd(S.week), ai=S.summary&&S.summary.ai;
  const out=["*סיכום שבוע "+S.week+" · "+dm(s)+"–"+dm(e)+"*"];
  if(ai&&ai.overview) out.push(ai.overview);
  for(const t of TEAMS){
    const x=teamStats(t.id); if(!x.list.length) continue;
    out.push("","*"+t.name+"* ("+x.done.length+"/"+x.list.length+")");
    const tai=ai&&ai.teams?ai.teams.find(z=>z.teamId===t.id):null;
    if(tai&&tai.summary) out.push(tai.summary);
    x.done.forEach(z=>out.push("✅ "+z.title)); x.open.forEach(z=>out.push("⬜ "+z.title));
  }
  if(ai&&ai.focusNextWeek&&ai.focusNextWeek.length){out.push("","*פוקוס לשבוע הבא*");ai.focusNextWeek.forEach(f=>out.push("• "+f))}
  return out.join("\n");
}
async function copySummary(){
  const txt=summaryText(), box=$("copyBox"); box.textContent="";
  try{await navigator.clipboard.writeText(txt);toast("הועתק. אפשר להדביק בוואטסאפ")}
  catch(e){const ta=el("textarea",{class:"copyfallback",readonly:true,"aria-label":"טקסט להעתקה"});ta.value=txt;box.append(ta);ta.focus();ta.select();toast("סמנו והעתיקו את הטקסט")}
}
async function carryOver(){
  if(!guard()) return;
  const btn=$("carryOver"); btn.disabled=true;
  const open=S.tasks.filter(t=>!t.done&&!t.carried), now=Date.now();
  const ops=[];
  open.forEach((t,i)=>{
    ops.push({op:"insert",sheet:"tasks",row:{id:uid("t"),week:S.week+1,team:t.team,title:t.title,done:false,source:"carried",addedOn:iso(weekStart(S.week+1)),doneOn:"",carried:false,carriedFrom:t.id,createdAt:now+i}});
    ops.push({op:"update",sheet:"tasks",id:t.id,fields:{carried:true}});
  });
  try{await run(()=>batch(ops));toast(open.length+" משימות הועברו לשבוע "+(S.week+1));refresh()}
  catch(e){writeErr(e)}finally{btn.disabled=false}
}

/* ---------- tabs, wiring, boot ---------- */
function setTab(t){
  S.tab=t;
  for(const k of ["tasks","logs","summary"]){$("tab-"+k).setAttribute("aria-selected",k===t?"true":"false");$("view-"+k).hidden=k!==t}
  if(t==="tasks")renderTasks(); if(t==="logs")renderLogs(); if(t==="summary")renderDeck();
}
function renderAll(){renderRail();renderHead();renderCodeBar();renderChips();renderPanel();setTab(S.tab)}
$("tab-tasks").onclick=()=>setTab("tasks");
$("tab-logs").onclick=()=>setTab("logs");
$("tab-summary").onclick=()=>setTab("summary");
$("openDaily").onclick=openPanel;
$("genSummary").onclick=generateSummary;
$("copySummary").onclick=copySummary;
$("carryOver").onclick=carryOver;
$("editSummary").onclick=startSumEdit;
addEventListener("hashchange",()=>{const w=readHash();if(w&&w!==S.week){S.week=w;S.editTask=null;S.editLog=null;S.editSum=null;S.tasks=[];S.logs=[];S.summary=null;S.sig="";renderAll();loadWeek(false)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!S.busy)loadWeek(true)});
setInterval(()=>{if(document.visibilityState==="visible"&&!S.busy&&!(S.panel&&S.panel.working))loadWeek(true)},POLL_MS);

/* ---------- install as app ---------- */
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
let installEvt=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;$("installBtn").hidden=false});
$("installBtn").onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;$("installBtn").hidden=true};
addEventListener("appinstalled",()=>{$("installBtn").hidden=true});
(function iosHint(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent), standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
  if(!ios||standalone||lsGet("mm_ios_hint")) return;
  const box=$("iosHint");
  box.append(el("div",{class:"notice ioshint"},el("span",null,"להתקנה כאפליקציה: לחצו על ",el("b",{text:"שיתוף"})," ואז ",el("b",{text:"הוספה למסך הבית"}),"."),
    el("button",{"aria-label":"סגור",onclick:()=>{lsSet("mm_ios_hint","1");box.textContent=""}},"×")));
})();

S.week=readHash()||curWeek();
renderAll();

(async()=>{
  if(!CONFIGURED){setStatus("האתר עוד לא מחובר ל-Google Sheet. הדביקו את כתובת ה-Web app בראש הקוד (ראו README).");return}
  setStatus("טוען…");
  try{
    const c=await api("config");
    if(c.settings&&isIso(c.settings.season_start)) SEASON_START=parseIso(c.settings.season_start);
    if(Array.isArray(c.teams)&&c.teams.length) setTeams(c.teams.filter(t=>t&&t.id).map(t=>({id:String(t.id),name:String(t.name||t.id),alias:[String(t.name||"")].concat(String(t.aliases||"").split(",")).map(x=>x.trim()).filter(Boolean)})));
    if(Array.isArray(c.events)) EVENTS=c.events.filter(e=>e&&isIso(e.date)).map(e=>({date:e.date,title:String(e.title||"")}));
    S.ai=!!c.ai; S.needsCode=!!c.needsCode; S.ready=true;
    if(!readHash()) S.week=curWeek();
    renderAll(); await loadWeek(false);
  }catch(e){setStatus("לא הצלחתי להתחבר ל-Google Sheet. בדקו שהכתובת נכונה ושהפריסה פתוחה ל-Anyone.")}
})();
})();
