<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1924">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MM לוח">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>MM לוח שבועי</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Open+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" dir="rtl" lang="he">
  <div class="top">
    <div class="brand">
      <img src="logo.webp" alt="לוגו MM">
      <div class="grow">
        <h1>MM <span>לוח שבועי</span></h1>
        <div class="sub">משימות, סיכומים יומיים וסיכום שבוע · עונת 2026-27</div>
      </div>
      <button class="me" id="meBtn" hidden></button>
      <button class="install" id="installBtn" hidden>התקן כאפליקציה</button>
      <div class="stage-pill" id="stagePill"></div>
    </div>
    <nav class="rail" id="rail" aria-label="שבועות"></nav>
  </div>

  <section class="weekhead">
    <div>
      <h2 id="weekTitle"></h2>
      <div class="dates" id="weekDates"></div>
      <div class="events" id="weekEvents"></div>
    </div>
    <div class="progress">
      <div class="nums"><span>בוצעו</span><span><b id="doneN">0</b> / <span id="totalN">0</span></span></div>
      <div class="bar"><i id="barFill" style="width:0"></i></div>
    </div>
  </section>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-tasks" aria-selected="true">משימות</button>
      <button class="tab" role="tab" id="tab-logs" aria-selected="false">סיכומים יומיים</button>
      <button class="tab" role="tab" id="tab-summary" aria-selected="false">סיכום שבוע</button>
    </div>
    <button class="btn primary" id="openDaily">+ סיכום יומי</button>
  </div>

  <div id="iosHint"></div>
  <div id="codeBar"></div>
  <div id="status"></div>
  <div id="dailyPanel" hidden></div>

  <section id="view-tasks">
    <div class="chips" id="teamChips"></div>
    <div class="teams" id="teams"></div>
  </section>
  <section id="view-logs" hidden><div class="logs" id="logs"></div></section>
  <section id="view-summary" hidden>
    <div class="deck-actions">
      <button class="btn primary" id="genSummary">הפק סיכום שבוע עם Gemini</button>
      <button class="btn" id="copySummary">העתק כטקסט לוואטסאפ</button>
      <button class="btn" id="editSummary">✏️ ערוך סיכום</button>
      <button class="btn ghost" id="carryOver"></button>
      <span class="aitag" id="genInfo"></span>
    </div>
    <div id="copyBox"></div>
    <div id="sumEdit"></div>
    <div class="deck" id="deck"></div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
